:root {
  --papel: #F3F5FA;
  --grade: #E1E6F0;
  --sup: #FFFFFF;
  --sup2: #EDF0F7;
  --tinta: #1B1E3A;
  --tinta2: #4B5070;
  --linha: #D3D9E6;
  --marca: #FFD43B;
  --marca-escura: #E9B800;
  --logo-bg: #1B1E3A;
  --ok: #17834B;  --ok-bg: #E2F4E9;  --ok-borda: #9FD8B6;
  --azul: #1F5CC0; --azul-bg: #E3ECFB; --azul-borda: #A9C3F0;
  --verm: #C42430; --verm-bg: #FCE5E6; --verm-borda: #F0A9AE;
  --cinza: #5D6380; --cinza-bg: #ECEEF4; --cinza-borda: #CDD2E0;
  --prim-bg: #1B1E3A; --prim-tx: #FFFFFF;
  --foco: #1F5CC0;
  --sombra: 0 1px 0 rgba(27, 30, 58, .05), 0 10px 28px -16px rgba(27, 30, 58, .35);
  --r-g: 22px; --r: 14px; --r-p: 9px;
  --f-tit: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-txt: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
[data-tema="escuro"] {
  --papel: #11142A;
  --grade: #181C36;
  --sup: #1A1E3A;
  --sup2: #232848;
  --tinta: #EEF0FA;
  --tinta2: #B3B8D6;
  --linha: #30365D;
  --logo-bg: #2B3163;
  --ok: #4CD08C;  --ok-bg: #11301F;  --ok-borda: #24613F;
  --azul: #7FAAFF; --azul-bg: #142342; --azul-borda: #2D4A85;
  --verm: #FF7C84; --verm-bg: #3A1720; --verm-borda: #7A2A35;
  --cinza: #A3A8C6; --cinza-bg: #252A49; --cinza-borda: #3A4068;
  --prim-bg: #FFD43B; --prim-tx: #1B1E3A;
  --foco: #FFD43B;
  --sombra: 0 12px 30px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--f-txt);
  font-size: 1rem;
  line-height: 1.5;
  color: var(--tinta);
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--grade) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 26px 26px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}
h1, h2, h3 { font-family: var(--f-tit); font-weight: 700; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
[hidden] { display: none !important; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: .55em; text-decoration: none; color: var(--tinta); }
.logo-marca { width: 2.1em; height: 2.1em; flex: none; }
.logo-nome { font-family: var(--f-tit); font-weight: 700; font-size: 1.45em; letter-spacing: -.035em; line-height: 1; white-space: nowrap; }
.logo-ai { position: relative; }
.logo-i { position: relative; display: inline-block; }
.logo-i::after {
  content: ""; position: absolute; left: 50%; top: -.06em;
  width: .15em; height: .3em; border-radius: .08em;
  background: var(--marca);
  transform: translateX(-30%) rotate(32deg);
}
.logo--grande { font-size: 1.6rem; }

/* ---------- Barra superior ---------- */
.barra {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px clamp(14px, 4vw, 36px);
  background: color-mix(in srgb, var(--papel) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--linha);
}
.barra .logo { font-size: .95rem; }
.acoes { display: flex; align-items: center; gap: 8px; }
.quem { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; margin-right: 6px; }
.quem strong { font-size: 1rem; }
.quem span { font-size: .95rem; color: var(--tinta2); }
.btn-icone {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 44px; height: 44px; padding: 0 12px;
  border: 1px solid var(--linha); border-radius: 999px; background: var(--sup); cursor: pointer;
}
.btn-icone:hover { border-color: var(--tinta2); }
.btn-icone .rot { font-size: .95rem; }
.contador {
  position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 999px; background: var(--verm); color: #fff; font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--papel);
}

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: var(--r-p);
  border: 1px solid transparent; cursor: pointer; font-weight: 700; text-decoration: none; text-align: center;
}
.btn.prim { background: var(--prim-bg); color: var(--prim-tx); }
.btn.prim:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--marca) 55%, transparent); }
.btn.sec { background: var(--sup); border-color: var(--linha); }
.btn.sec:hover { border-color: var(--tinta2); }
.btn.perigo { background: var(--verm); color: #fff; }
.btn.largo { width: 100%; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: inherit; }

/* ---------- Estrutura ---------- */
.pagina { max-width: 1160px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 36px); }
.rodape { max-width: 1160px; margin: 24px auto 0; padding: 18px clamp(14px, 4vw, 36px); color: var(--tinta2); font-size: .95rem; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; border-top: 1px solid var(--linha); }

/* ---------- Entrar ---------- */
.entrada { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(20px, 5vw, 64px); align-items: start; padding-top: clamp(10px, 4vw, 40px); }
.apresentacao h1 { font-size: clamp(2rem, 4.6vw, 3.25rem); margin: 28px 0 16px; max-width: 16ch; letter-spacing: -.03em; }
.apresentacao > p { font-size: 1.12rem; color: var(--tinta2); max-width: 46ch; }
.amostra { margin-top: 30px; display: grid; gap: 10px; max-width: 470px; }
.amostra-item { display: flex; align-items: center; gap: 12px; background: var(--sup); border: 1px solid var(--linha); border-left: 6px solid var(--st); border-radius: var(--r-p); padding: 10px 14px; }
.amostra-item b { font-weight: 700; }
.amostra-item span:last-child { margin-left: auto; color: var(--st); font-weight: 700; white-space: nowrap; }
.turmas-teste { margin-top: 26px; }
.turmas-teste h2 { font-size: 1.1rem; margin-bottom: 8px; }
.chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { background: var(--sup); border: 1px solid var(--linha); border-radius: 999px; padding: 5px 14px; font-size: .95rem; }
.chips li b { font-weight: 700; }

.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: clamp(20px, 3.5vw, 32px); box-shadow: var(--sombra); }
.cartao h2 { font-size: 1.6rem; margin-bottom: 18px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sup2); border-radius: 999px; padding: 4px; border: 1px solid var(--linha); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label, .seg button { display: block; text-align: center; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; border: 0; background: none; min-height: 40px; }
.seg input:checked + span, .seg button[aria-pressed="true"] { background: var(--sup); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
[data-tema="escuro"] .seg input:checked + span, [data-tema="escuro"] .seg button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.seg label span { display: block; padding: 8px 18px; border-radius: 999px; }
.seg label { padding: 0; }
.seg input:focus-visible + span { outline: 3px solid var(--foco); outline-offset: 1px; }
.seg--largo { display: grid; width: 100%; }

.campo { display: grid; gap: 6px; margin-bottom: 16px; align-content: start; }
.campo > span:first-child, .campo legend { font-weight: 700; }
.campo small, .dica { color: var(--tinta2); font-size: .95rem; }
.campo input:not([type=checkbox]):not([type=radio]):not([type=file]), .campo select, .campo textarea {
  width: 100%; min-height: 48px; padding: 10px 14px;
  border: 1.5px solid var(--linha); border-radius: var(--r-p); background: var(--sup);
}
.campo textarea { min-height: 110px; resize: vertical; }
.campo input:hover, .campo select:hover, .campo textarea:hover { border-color: var(--tinta2); }
.campo [aria-invalid="true"] { border-color: var(--verm) !important; background: var(--verm-bg) !important; }
.erro-msg { color: var(--verm); font-weight: 700; font-size: .95rem; }
.erro-msg:empty { display: none; }
.erro-geral { background: var(--verm-bg); color: var(--verm); border: 1px solid var(--verm-borda); border-radius: var(--r-p); padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
.erro-geral:empty { display: none; }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grade3 { display: grid; grid-template-columns: 1.2fr .9fr .8fr; gap: 0 14px; }
fieldset.campo { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
.opcoes { display: grid; gap: 8px; }
.opcao { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1.5px solid var(--linha); border-radius: var(--r-p); cursor: pointer; background: var(--sup); }
.opcao input { width: 20px; height: 20px; accent-color: var(--tinta); }
[data-tema="escuro"] .opcao input { accent-color: var(--marca); }
.opcao:has(input:checked) { border-color: var(--tinta); background: var(--sup2); }
.opcao small { margin-left: auto; color: var(--tinta2); }
.arquivo-atual { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--sup2); border-radius: var(--r-p); }
input[type=file] { width: 100%; padding: 10px; border: 1.5px dashed var(--linha); border-radius: var(--r-p); background: var(--sup); }

.demo { margin-top: 22px; padding: 16px; border-radius: var(--r); background: color-mix(in srgb, var(--marca) 26%, var(--sup)); border: 1px dashed var(--marca-escura); }
[data-tema="escuro"] .demo { background: color-mix(in srgb, var(--marca) 10%, var(--sup)); }
.demo h3 { font-size: 1.1rem; margin-bottom: 4px; }
.demo .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.alternar { margin-top: 18px; color: var(--tinta2); }
.alternar a { font-weight: 700; color: var(--tinta); }

/* ---------- Cadastro ---------- */
.cadastro { max-width: 640px; margin: 0 auto; }
.voltar { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; font-weight: 700; text-decoration: none; }
.voltar:hover { text-decoration: underline; }
.selo { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: .95rem; margin-bottom: 12px; }
.selo--aluno { background: var(--azul-bg); color: var(--azul); }
.selo--prof { background: color-mix(in srgb, var(--marca) 40%, var(--sup)); color: var(--tinta); }
[data-tema="escuro"] .selo--prof { color: var(--marca); background: color-mix(in srgb, var(--marca) 14%, var(--sup)); }
.cadastro .cartao h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin-bottom: 6px; }
.cadastro .cartao > p { color: var(--tinta2); margin-bottom: 22px; }

/* ---------- Painel ---------- */
.saudacao { display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: end; margin-bottom: 22px; }
.saudacao h1 { font-size: clamp(1.9rem, 4.4vw, 2.7rem); letter-spacing: -.03em; }
.saudacao h1:focus, h1[tabindex="-1"]:focus { outline: none; }
.resumo { font-size: 1.12rem; margin-top: 8px; max-width: 62ch; color: var(--tinta2); }
.resumo b { color: var(--tinta); }
.aviso-perm { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 18px; border-radius: var(--r); background: var(--sup); border: 1px solid var(--linha); margin-bottom: 18px; }
.aviso-perm p { flex: 1 1 320px; }
.aviso-perm .ico { width: 1.5em; height: 1.5em; color: var(--azul); }

.ferramentas { display: grid; grid-template-columns: minmax(200px, 1fr) auto auto auto; gap: 10px; align-items: end; margin-bottom: 14px; }
.ferramentas .campo { margin: 0; }
.busca { position: relative; }
.busca .ico { position: absolute; left: 14px; bottom: 15px; color: var(--tinta2); }
.busca input { padding-left: 42px !important; }
.legenda { list-style: none; padding: 0; margin: 0 0 22px; display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--tinta2); font-size: .95rem; }
.legenda li { display: inline-flex; align-items: center; gap: 8px; }
.legenda i { width: 14px; height: 14px; border-radius: 4px; background: var(--st); display: inline-block; }

.secao-titulo { display: flex; align-items: baseline; gap: 10px; font-size: 1.3rem; margin: 26px 0 12px; }
.secao-titulo span { font-family: var(--f-txt); font-size: 1rem; color: var(--tinta2); font-weight: 400; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.vazio { padding: 26px; text-align: center; border: 1.5px dashed var(--linha); border-radius: var(--r); color: var(--tinta2); background: var(--sup); }

.st-ok   { --st: var(--ok);   --st-bg: var(--ok-bg);   --st-borda: var(--ok-borda); }
.st-azul { --st: var(--azul); --st-bg: var(--azul-bg); --st-borda: var(--azul-borda); }
.st-verm { --st: var(--verm); --st-bg: var(--verm-bg); --st-borda: var(--verm-borda); }
.st-cinza{ --st: var(--cinza);--st-bg: var(--cinza-bg);--st-borda: var(--cinza-borda); }

.item {
  position: relative; display: grid; grid-template-columns: 84px minmax(0, 1fr) 262px;
  background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r);
}
.item::before { content: ""; position: absolute; inset: -1px auto -1px -1px; width: 8px; background: var(--st); border-radius: var(--r) 0 0 var(--r); }
.quando {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 6px 14px 14px; border-right: 2px dashed var(--linha); background: var(--st-bg);
  text-align: center; line-height: 1.1; border-radius: var(--r) 0 0 var(--r);
}
.quando .wd, .quando .mes { font-size: .95rem; color: var(--tinta2); text-transform: lowercase; }
.quando .dia { font-family: var(--f-tit); font-size: 2.1rem; font-weight: 700; color: var(--st); letter-spacing: -.03em; }
.quando .hora { margin-top: 6px; font-weight: 700; font-size: .95rem; }
.conteudo { padding: 14px 18px; min-width: 0; }
.linha1 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.tipo { display: inline-block; padding: 1px 10px; border-radius: 6px; font-weight: 700; font-size: .95rem; border: 1.5px solid var(--tinta); }
.tipo-prova { background: var(--tinta); color: var(--papel); }
.tipo-trabalho { background: transparent; }
.tipo-atividade { border-style: dashed; }
.materia { font-weight: 700; color: var(--tinta2); }
.titulo { font-family: var(--f-txt); font-size: 1.2rem; font-weight: 700; line-height: 1.3; margin: 2px 0 6px; }
.link-titulo { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: inherit; }
.link-titulo:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--tinta2); font-size: .95rem; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.desc { margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.anexo { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup2); cursor: pointer; max-width: 100%; text-align: left; }
.anexo span.nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anexo small { color: var(--tinta2); font-size: .95rem; white-space: nowrap; }
.anexo:hover { border-color: var(--tinta2); }
.lado { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--linha); justify-content: center; }
.status { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 10px; background: var(--st-bg); color: var(--st); border: 1px solid var(--st-borda); }
.status .ico { margin-top: 3px; }
.status strong { display: block; }
.status .det { display: block; color: var(--tinta); font-size: .95rem; }
.concluir {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1.5px solid var(--linha); border-radius: 10px; background: var(--sup); cursor: pointer; font-weight: 700; text-align: left;
}
.concluir .caixa { width: 22px; height: 22px; border: 2px solid var(--tinta2); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.concluir .caixa .ico { width: 16px; height: 16px; opacity: 0; stroke-width: 3; }
.concluir:hover { border-color: var(--ok); }
.concluir[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
[data-tema="escuro"] .concluir[aria-pressed="true"] { color: #0C2416; }
.concluir[aria-pressed="true"] .caixa { border-color: currentColor; }
.concluir[aria-pressed="true"] .caixa .ico { opacity: 1; }
.contagem-alunos { font-size: .95rem; color: var(--tinta2); }
.botoes-linha { display: flex; gap: 8px; }
.botoes-linha .btn { flex: 1; min-height: 42px; padding: 8px 10px; }

.cal { position: relative; }
.cal summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 12px; border: 1px solid var(--linha); border-radius: 10px; cursor: pointer; font-weight: 700; background: var(--sup); }
.cal summary::-webkit-details-marker { display: none; }
.cal summary:hover { border-color: var(--tinta2); }
.cal-op { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; width: 290px; padding: 6px; background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; box-shadow: var(--sombra); display: grid; gap: 2px; }
.cal-op button, .cal-op a { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-decoration: none; font-weight: 700; }
.cal-op small { grid-column: 2; font-weight: 400; color: var(--tinta2); font-size: .95rem; }
.cal-op button:hover, .cal-op a:hover { background: var(--sup2); }

/* ---------- Professor ---------- */
.painel-prof { display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 28px; align-items: start; }
.form-lanc { position: sticky; top: 86px; }
.form-lanc h2 { font-size: 1.45rem; margin-bottom: 4px; }
.form-lanc > p { color: var(--tinta2); margin-bottom: 18px; }
.editando { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; margin-bottom: 16px; border-radius: var(--r-p); background: color-mix(in srgb, var(--marca) 30%, var(--sup)); font-weight: 700; }
[data-tema="escuro"] .editando { background: color-mix(in srgb, var(--marca) 14%, var(--sup)); }
.seg-tipo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg-tipo label { display: block; cursor: pointer; }
.seg-tipo input { position: absolute; opacity: 0; }
.seg-tipo span { display: block; text-align: center; padding: 10px; border: 1.5px solid var(--linha); border-radius: var(--r-p); font-weight: 700; background: var(--sup); }
.seg-tipo input:checked + span { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.seg-tipo input:focus-visible + span { outline: 3px solid var(--foco); outline-offset: 2px; }
.item--prof { grid-template-columns: 84px minmax(0, 1fr); }
.item--prof .lado { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--linha); flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px 12px 22px; }
.item--prof .lado > * { flex: 1 1 180px; }
.item--prof .quando { border-radius: var(--r) 0 0 0; }
.filtro-prof { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.filtro-prof .campo { margin: 0; min-width: 220px; }

/* ---------- Aba solta: próxima entrega ---------- */
.aba {
  position: fixed; left: clamp(10px, 2.5vw, 24px); bottom: clamp(10px, 2.5vw, 24px); z-index: 30;
  width: 300px; max-width: calc(100vw - 20px);
  background: var(--marca); color: #1B1E3A; border-radius: 6px 18px 18px 18px;
  box-shadow: 0 18px 30px -14px rgba(27, 30, 58, .55), 0 2px 0 rgba(0,0,0,.08);
  transform: rotate(-1.2deg); transform-origin: bottom left;
  animation: aba-entra .5s cubic-bezier(.2, .9, .3, 1.3) both;
}
.aba::before { content: ""; position: absolute; top: -9px; left: 22px; width: 64px; height: 18px; background: color-mix(in srgb, #fff 55%, transparent); border-radius: 3px; transform: rotate(-4deg); }
@keyframes aba-entra { from { opacity: 0; transform: translateY(30px) rotate(-6deg); } }
.aba-topo { display: flex; width: 100%; align-items: center; gap: 8px; padding: 12px 14px; background: none; border: 0; cursor: pointer; color: inherit; font-weight: 700; text-align: left; }
.aba-topo > span:first-of-type { white-space: nowrap; }
.aba-topo .mini { margin-left: auto; padding: 1px 10px; background: #1B1E3A; color: #FFD43B; border-radius: 999px; font-size: .95rem; white-space: nowrap; }
.aba-topo .chev { transition: transform .2s; }
.aba[data-aberta="false"] .chev { transform: rotate(180deg); }
.aba-corpo { padding: 0 16px 16px; }
.aba[data-aberta="false"] .aba-corpo { display: none; }
.aba[data-aberta="false"] { width: auto; }
.aba-l1 { font-size: .95rem; font-weight: 700; opacity: .85; }
.aba-titulo { font-family: var(--f-tit); font-size: 1.25rem; line-height: 1.2; margin: 2px 0 8px; }
.aba-quando { font-size: .95rem; }
.aba-conta { font-family: var(--f-tit); font-size: 1.5rem; margin-top: 4px; letter-spacing: -.02em; }
.aba-ver { margin-top: 10px; width: 100%; min-height: 42px; border: 0; border-radius: 10px; background: #1B1E3A; color: #fff; font-weight: 700; cursor: pointer; }
.aba :focus-visible { outline-color: #1B1E3A; }

/* ---------- Diálogos ---------- */
dialog { border: 0; padding: 0; background: transparent; color: var(--tinta); max-width: min(680px, calc(100vw - 24px)); width: 100%; }
dialog::backdrop { background: rgba(10, 12, 30, .55); }
.dlg { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: clamp(18px, 4vw, 30px); box-shadow: var(--sombra); max-height: calc(100vh - 40px); overflow: auto; }
.dlg-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.dlg h2 { font-size: 1.6rem; margin: 6px 0 12px; }
.dlg .botoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin: 18px 0; }
.ficha div { padding: 10px 14px; background: var(--sup2); border-radius: 10px; }
.ficha dt { font-size: .95rem; color: var(--tinta2); }
.ficha dd { margin: 0; font-weight: 700; }
.ficha .inteira { grid-column: 1 / -1; }
.dlg h3 { font-family: var(--f-txt); font-size: 1.05rem; margin: 6px 0; }
.dlg-desc { white-space: pre-wrap; }
.dlg .cal-op { position: static; width: auto; box-shadow: none; margin-top: 6px; }
dialog.lateral { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; max-width: min(440px, 100vw); }
dialog.lateral .dlg { height: 100%; max-height: 100vh; border-radius: var(--r-g) 0 0 var(--r-g); }
.avisos { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
.avisos li { padding: 12px 14px; border-radius: 12px; background: var(--sup2); border-left: 5px solid var(--st); }
.avisos li.nao-lido { background: var(--st-bg); }
.avisos strong { display: block; }
.avisos small { color: var(--tinta2); font-size: .95rem; }
.perm-status { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--linha); display: grid; gap: 10px; }

/* ---------- Toasts ---------- */
#toasts { position: fixed; top: 76px; right: clamp(10px, 3vw, 28px); z-index: 60; display: grid; gap: 8px; width: min(380px, calc(100vw - 20px)); }
.toast { padding: 12px 16px; border-radius: 12px; background: var(--tinta); color: var(--papel); box-shadow: var(--sombra); display: flex; gap: 10px; align-items: flex-start; animation: toast-entra .25s ease-out both; }
.toast.erro { background: var(--verm); color: #fff; }
@keyframes toast-entra { from { opacity: 0; transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Responsivo ---------- */
@media (max-width: 980px) {
  .painel-prof { grid-template-columns: 1fr; }
  .form-lanc { position: static; }
  .ferramentas { grid-template-columns: 1fr 1fr; }
  .ferramentas .busca { grid-column: 1 / -1; }
}
@media (max-width: 820px) {
  .entrada { grid-template-columns: 1fr; }
  .apresentacao h1 { margin-top: 18px; }
  .item, .item--prof { grid-template-columns: 70px minmax(0, 1fr); }
  .lado { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--linha); flex-direction: row; flex-wrap: wrap; padding: 12px 14px 12px 20px; }
  .lado > * { flex: 1 1 200px; }
  .quando { border-radius: var(--r) 0 0 0; }
  .item--prof .quando { border-radius: var(--r) 0 0 0; }
  .saudacao { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  html { font-size: 100%; }
  .quem, .btn-icone .rot { display: none; }
  .grade2, .grade3 { grid-template-columns: 1fr; }
  .ferramentas { grid-template-columns: 1fr; }
  .ferramentas .seg { width: 100%; }
  .ficha { grid-template-columns: 1fr; }
  .demo .botoes { grid-template-columns: 1fr; }
  .quando .dia { font-size: 1.8rem; }
  .conteudo { padding: 12px 14px; }
  .aba { width: calc(100vw - 20px); }
  .aba[data-aberta="false"] { width: auto; }
  .cal-op { left: 0; right: auto; width: min(290px, calc(100vw - 40px)); }
  #toasts { top: 74px; }
  .toast { padding: 10px 14px; }
}

<script>
'use strict';

/* =========================================================
   ALE: organizador de entregas acadêmicas
   Protótipo da Atividade Prática de Scrum
   ========================================================= */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const semAcento = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

/* ---------- Turmas de teste ---------- */
const TURMAS = [
  { id: 'gestao-agil', nome: 'Gestão Ágil', periodo: 'Noite', horario: '19h00 às 22h30' },
  { id: 'banco-dados', nome: 'Banco de Dados', periodo: 'Noite', horario: '19h00 às 22h30' },
];
const turma = id => TURMAS.find(t => t.id === id) || { id, nome: 'Turma', periodo: '', horario: '' };
const TIPOS = ['Atividade', 'Trabalho', 'Prova'];
const artigoNovo = tipo => tipo === 'Trabalho' ? 'Novo trabalho' : 'Nova ' + tipo.toLowerCase();

/* ---------- Ícones ---------- */
const ICONES = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alerta: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  sino: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lua: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clipe: '<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  lupa: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  editar: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  lixo: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  baixar: '<path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/>',
  chev: '<path d="m6 15 6-6 6 6"/>',
  sair: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  externo: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  voltar: '<path d="m15 18-6-6 6-6"/>',
  mais: '<path d="M12 5v14M5 12h14"/>',
};
const ico = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n] || ''}</svg>`;
const icoStatus = cls => ico(cls === 'ok' ? 'check' : cls === 'verm' ? 'alerta' : 'relogio');

const LOGO_MARCA = `<svg class="logo-marca" viewBox="0 0 64 64" aria-hidden="true">
  <rect x="1" y="1" width="62" height="62" rx="18" fill="var(--logo-bg)"/>
  <path d="M15 46 29 16h7l14 30h-9l-3-7H27l-3 7z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <path d="m27 32 6 6 13-14" fill="none" stroke="#FFD43B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 </svg>`;
const logo = (cls = '') => `<span class="logo ${cls}" role="img" aria-label="ALE">${LOGO_MARCA}<span class="logo-nome" aria-hidden="true">ALE</span></span>`;

/* ---------- Datas ---------- */
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hojeISO = () => isoDate(new Date());
const addDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); };
function toDate(data, hora = '00:00') {
  const [y, m, d] = String(data).split('-').map(Number);
  const [hh, mm] = String(hora || '00:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0);
}
function diasAte(data) {
  const t = new Date();
  const hoje = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((toDate(data) - hoje) / 864e5);
}
const fmtSemana = d => new Intl.DateTimeFormat('pt-BR', { weekday: 'short' }).format(d).replace('.', '');
const fmtMes = d => new Intl.DateTimeFormat('pt-BR', { month: 'short' }).format(d).replace('.', '');
const fmtData = data => { const d = toDate(data); return `${fmtSemana(d)}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtDataLonga = data => new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(toDate(data));
const fmtPts = n => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const pontos = n => `${fmtPts(n)} ${Number(n) >= 1 && Number(n) < 2 ? 'ponto' : 'pontos'}`;
const fmtTam = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
const entregaEm = a => toDate(a.data, a.hora);
const ordenar = lista => lista.sort((a, b) => toDate(a.data) - toDate(b.data));
function quandoRelativo(a) {
  const d = diasAte(a.data);
  if (d === 0) return `hoje às ${a.hora}`;
  if (d === 1) return `amanhã às ${a.hora}`;
  if (d < 0) return `${fmtData(a.data)} (atrasada)`;
  return `${fmtData(a.data)} às ${a.hora}, em ${d} dias`;
}
function contagem(a) {
  const ms = entregaEm(a) - new Date();
  const d = diasAte(a.data);
  if (d < 0) return d === -1 ? 'Venceu ontem' : `Venceu há ${-d} dias`;
  if (d === 0) {
    if (ms <= 0) return `Encerrou hoje às ${a.hora}`;
    const h = Math.floor(ms / 36e5), m = Math.floor((ms % 36e5) / 6e4);
    return `Hoje, em ${h ? h + ' h ' : ''}${m} min`;
  }
  if (d === 1) return 'Amanhã';
  return `Faltam ${d} dias`;
}
function contagemCurta(a) {
  const d = diasAte(a.data);
  if (d < 0) return 'atrasada';
  if (d === 0) return 'hoje';
  if (d === 1) return 'amanhã';
  return `em ${d} dias`;
}

/* ---------- Armazenamento ---------- */
const KEY = 'entregai.dados.v1', SKEY = 'entregai.sessao', TKEY = 'entregai.tema', AKEY = 'entregai.aba';
let db = null;
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function salvar() {
  if (!ls.set(KEY, JSON.stringify(db))) {
    toast('Não foi possível salvar neste navegador. Saia do modo anônimo ou libere espaço e tente de novo.', 'erro');
    return false;
  }
  return true;
}

/* Arquivos anexos ficam no IndexedDB (aceita arquivos maiores que o localStorage) */
const Arquivos = {
  _db: null,
  abrir() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB indisponível'));
      const r = indexedDB.open('ale-arquivos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('arquivos');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async op(modo, fn) {
    const d = await this.abrir();
    return new Promise((res, rej) => {
      const tx = d.transaction('arquivos', modo);
      const rq = fn(tx.objectStore('arquivos'));
      tx.oncomplete = () => res(rq && rq.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  salvar(id, blob) { return this.op('readwrite', st => st.put(blob, id)); },
  ler(id) { return this.op('readonly', st => st.get(id)); },
  apagar(id) { return this.op('readwrite', st => st.delete(id)).catch(() => {}); },
  limpar() { return this.op('readwrite', st => st.clear()).catch(() => {}); },
};

async function hash(txt) {
  const dados = new TextEncoder().encode('entregai:' + txt);
  if (window.crypto && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', dados);
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {}
  }
  let h = 5381;
  for (const b of dados) h = ((h << 5) + h + b) >>> 0;
  return 'f' + h.toString(16);
}

/* ---------- Dados de demonstração (fictícios) ---------- */

      descricao: 'Conteúdo: modelo entidade-relacionamento, normalização até a 3FN e comandos SELECT, INSERT, UPDATE e DELETE. Prova individual e sem consulta.' },
    { tipo: 'Atividade', titulo: 'Product Backlog do organizador de entregas', turma: 'gestao-agil', professor: 'Prof. Marcos Andrade', data: addDias(0), hora: '22:00', valor: 1, aula: addDias(-7),

      descricao: 'Entregar o Objetivo da Sprint, o Sprint Backlog, o quadro (A fazer, Em andamento, Concluído) e o protótipo testado por outro integrante.' },
    { tipo: 'Atividade', titulo: 'Lista de exercícios: normalização', turma: 'banco-dados', professor: 'Profa. Juliana Ribeiro', data: addDias(15), hora: '23:59', valor: 1.5, aula: addDias(-1),

      descricao: 'Desenhar o DER com entidades, atributos, relacionamentos e cardinalidades.', concluidaDemo: addDias(-4) },
  ];
  for (const it of lista) {
    const a = { id: uid(), ...base, ...it };
    delete a.anexoDemo; delete a.concluidaDemo;
    if (it.anexoDemo) {
      const texto = 'Lista de exercícios: normalização (arquivo de demonstração)\n\n1. Explique a diferença entre 1FN, 2FN e 3FN.\n2. Normalize a tabela PEDIDO até a 3FN.\n3. Identifique dependências parciais no exemplo da aula.\n...\n\nEntrega em PDF pelo ALE.';
      const blob = new Blob([texto], { type: 'text/plain' });
      a.anexo = { id: uid(), nome: 'lista-normalizacao.txt', tamanho: blob.size, tipo: 'text/plain' };
      try { await Arquivos.salvar(a.anexo.id, blob); } catch (e) { delete a.anexo; }
    }
    if (it.concluidaDemo) dados.concluidas['u-aluno'][a.id] = toDate(it.concluidaDemo, '20:15').toISOString();
    dados.atividades.push(a);

}

/* ---------- Sessão ---------- */
const usuarioAtual = () => { const id = ls.get(SKEY); return (db && db.usuarios.find(u => u.id === id)) || null; };
const primeiroNome = n => String(n).trim().split(/\s+/)[0];
const atividadesDoAluno = u => db.atividades.filter(a => u.turmas.includes(a.turma));
const atividadesDoProf = u => db.atividades.filter(a => a.criadoPor === u.id || u.turmas.includes(a.turma));
const foiConcluida = (a, u) => !!(db.concluidas[u.id] && db.concluidas[u.id][a.id]);

function situacao(a, u) {
  const d = diasAte(a.data);
  if (u && u.papel === 'aluno' && foiConcluida(a, u)) {
    const quando = new Date(db.concluidas[u.id][a.id]);
    return { cls: 'ok', rotulo: 'Entregue', detalhe: `Concluída em ${fmtData(isoDate(quando))}`, d };
  }
  if (d < 0) {
    if (u && u.papel === 'professor') return { cls: 'cinza', rotulo: 'Prazo encerrado', detalhe: d === -1 ? 'Venceu ontem' : `Venceu há ${-d} dias`, d };
    return { cls: 'verm', rotulo: 'Atrasada', detalhe: d === -1 ? 'Venceu ontem' : `Venceu há ${-d} dias`, d };
  }
  if (d === 0) return { cls: 'verm', rotulo: 'Entrega hoje', detalhe: `Hoje às ${a.hora}`, d };
  if (d <= 3) return { cls: 'verm', rotulo: 'Prazo próximo', detalhe: d === 1 ? 'Falta 1 dia' : `Faltam ${d} dias`, d };
  return { cls: 'azul', rotulo: 'A entregar', detalhe: `Faltam ${d} dias`, d };
}

/* ---------- Avisos (15 dias, 5 dias, dia da entrega) ---------- */
function marcoDe(d) {
  if (d < 0) return null;
  if (d === 0) return 'dia';
  if (d <= 5) return '5';
  if (d <= 15) return '15';
  return null;
}
function montarAviso(a, d, marco, nova) {
  const mat = turma(a.turma).nome;
  const titulo = `${nova ? artigoNovo(a.tipo) : a.tipo} de ${mat}`;
  let prazo;
  if (marco === 'dia') prazo = `chegou o dia da entrega! Hoje às ${a.hora}.`;
  else if (d === 1) prazo = `falta 1 dia. Entrega amanhã às ${a.hora}.`;
  else prazo = `faltam ${d} dias. Entrega ${fmtData(a.data)} às ${a.hora}.`;
  const corpo = `“${a.titulo}”: ${prazo} Vale ${pontos(a.valor)}. ${a.professor}.`;
  return { titulo, corpo };
}
function verificarAvisos() {
  const u = usuarioAtual();
  if (!u || u.papel !== 'aluno') return;
  db.enviados[u.id] = db.enviados[u.id] || {};
  db.avisos[u.id] = db.avisos[u.id] || [];
  const env = db.enviados[u.id];
  const novos = [];
  for (const a of ordenar(atividadesDoAluno(u))) {
    if (foiConcluida(a, u)) continue;
    const d = diasAte(a.data);
    const nova = !env[a.id + ':nova'] && a.criado > u.criado;
    const pref = db.lembretes?.[u.id] || { dias: [15,5], dia: true };
    let marco = null;
    if (d === 0 && pref.dia !== false && !env[a.id + ':dia']) marco = 'dia';
    else if (d > 0) {
      const opcoes = (pref.dias || []).map(Number).filter(x=>x>0).sort((x,y)=>y-x);
      marco = opcoes.find(x=>d<=x && !env[a.id + ':' + x])?.toString() || null;
    }
    const marcoPendente = marco && !env[a.id + ':' + marco];
    if (!nova && !marcoPendente) continue;
    env[a.id + ':nova'] = 1;
    if (marco) {
      env[a.id + ':' + marco] = 1;
      if (marco === 'dia') env[a.id + ':dia'] = 1;
    }
    if (d < 0) continue;
    const { titulo, corpo } = montarAviso(a, d, marco, nova);
    novos.push({ id: uid(), titulo, corpo, atv: a.id, quando: new Date().toISOString(), lido: false, cls: situacao(a, u).cls });
  }
  if (!novos.length) return;
  db.avisos[u.id] = [...novos, ...db.avisos[u.id]].slice(0, 60);
  salvar();
  novos.slice(0, 4).forEach((n, i) => setTimeout(() => notificarSistema(n.titulo, n.corpo, 'entregai-' + n.atv), i * 400));
  toast(novos.length === 1 ? `${novos[0].titulo}: ${novos[0].corpo}` : `Você tem ${novos.length} novos avisos de prazo. Toque no sino para ver.`);
  atualizarSino();
}
const naoLidos = u => (db.avisos[u.id] || []).filter(n => !n.lido).length;
function atualizarSino() {
  const u = usuarioAtual();
  const b = $('[data-action="avisos"]');
  if (!u || !b) return;
  const n = naoLidos(u);
  b.setAttribute('aria-label', n ? `Avisos: ${n} não lidos` : 'Avisos');
  const c = $('.contador', b);
  if (c) { c.textContent = n; c.hidden = !n; }
}
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function estadoNotificacao() {
  if (!('Notification' in window)) return ehIOS() && !instalado() ? 'ios' : 'sem-suporte';
  return Notification.permission; // default | granted | denied
}
async function notificarSistema(titulo, corpo, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const opcoes = { body: corpo, tag, icon: 'icon-192.png', badge: 'icon-192.png', lang: 'pt-BR' };
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(titulo, opcoes); return true; }
    }
  } catch (e) {}
  try { new Notification(titulo, opcoes); return true; } catch (e) { return false; }
}
async function pedirPermissao() {
  const est = estadoNotificacao();
  if (est === 'ios') { toast('No iPhone ou iPad: toque em Compartilhar, depois em “Adicionar à Tela de Início”. Abra o ALE pelo ícone e ative as notificações.', 'erro'); return; }
  if (est === 'sem-suporte') { toast('Este navegador não mostra notificações. Use o botão “Adicionar ao calendário” para receber os lembretes.', 'erro'); return; }
  const r = await Notification.requestPermission();
  if (r === 'granted') {
    toast('Notificações ativadas neste dispositivo.');
    notificarSistema('ALE', 'Pronto! Você vai receber avisos 15 dias antes, 5 dias antes e no dia de cada entrega.', 'entregai-boas-vindas');
  } else if (r === 'denied') {
    toast('As notificações foram bloqueadas. Para liberar, abra as configurações do navegador e permita notificações para este site.', 'erro');
  }
  render({ manterFoco: true });
}
function avisoTeste() {
  const u = usuarioAtual();
  const prox = ordenar(atividadesDoAluno(u).filter(a => !foiConcluida(a, u) && diasAte(a.data) >= 0))[0];
  let titulo = 'Aviso de teste', corpo = 'As notificações do ALE estão funcionando neste dispositivo.';
  if (prox) {
    const d = diasAte(prox.data);
    ({ titulo, corpo } = montarAviso(prox, d, marcoDe(d), false));
    titulo = 'Teste: ' + titulo;
  }
  db.avisos[u.id] = [{ id: uid(), titulo, corpo, atv: prox && prox.id, quando: new Date().toISOString(), lido: false, cls: prox ? situacao(prox, u).cls : 'azul' }, ...(db.avisos[u.id] || [])];
  salvar();
  notificarSistema(titulo, corpo, 'entregai-teste').then(ok => {
    toast(ok ? 'Aviso de teste enviado para o dispositivo.' : 'Aviso de teste registrado. Ative as notificações para recebê-lo também fora do site.');
  });
  abrirAvisos();
}

/* ---------- Calendário (.ics e Google Agenda) ---------- */
const icsData = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
function dobrar(linha) {
  const partes = [];
  let s = linha;
  while (s.length > 72) { partes.push(s.slice(0, 72)); s = ' ' + s.slice(72); }
  partes.push(s);
  return partes.join('\r\n');
}
function descricaoCal(a) {
  return [
    `${a.tipo} de ${turma(a.turma).nome} (${turma(a.turma).periodo})`,
    `Professor(a): ${a.professor}`,
    `Vale: ${pontos(a.valor)}`,
    a.aula ? `Dia da aula: ${fmtData(a.aula)}` : '',
    a.anexo ? `Anexo: ${a.anexo.nome} (disponível no ALE)` : '',
    a.descricao ? '\n' + a.descricao : '',
  ].filter(Boolean).join('\n');
}
function eventosICS(a) {
  const ini = entregaEm(a), fim = new Date(ini.getTime() + 36e5);
  const mat = turma(a.turma).nome;
  const agora = icsData(new Date());
  const linhas = [];
  let minutosAntes = Math.round((ini - toDate(a.data, '08:00')) / 6e4);
  if (minutosAntes < 60) minutosAntes = 60;
  linhas.push(
    'BEGIN:VEVENT', `UID:${a.id}@entregai.app`, `DTSTAMP:${agora}`, `DTSTART:${icsData(ini)}`, `DTEND:${icsData(fim)}`,
    `SUMMARY:${icsEsc(`${a.tipo} – ${mat}: ${a.titulo}`)}`, `DESCRIPTION:${icsEsc(descricaoCal(a))}`, `CATEGORIES:${icsEsc(a.tipo)},${icsEsc(mat)}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`Chegou o dia da entrega: ${a.titulo}`)}`, `TRIGGER:-PT${minutosAntes}M`, 'END:VALARM'
  );
  if (minutosAntes > 60) linhas.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`Falta 1 hora: ${a.titulo}`)}`, 'TRIGGER:-PT1H', 'END:VALARM');
  linhas.push('END:VEVENT');
  for (const n of [15, 5]) {
    const dia = toDate(a.data, '09:00');
    dia.setDate(dia.getDate() - n);
    if (dia <= new Date()) continue;
    linhas.push(
      'BEGIN:VEVENT', `UID:${a.id}-${n}d@entregai.app`, `DTSTAMP:${agora}`, `DTSTART:${icsData(dia)}`, `DTEND:${icsData(new Date(dia.getTime() + 15 * 6e4))}`,
      `SUMMARY:${icsEsc(`Lembrete: faltam ${n} dias – ${a.tipo} de ${mat}`)}`,
      `DESCRIPTION:${icsEsc(`${a.titulo}\nEntrega: ${fmtData(a.data)} às ${a.hora}\n\n${descricaoCal(a)}`)}`,
      'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`Faltam ${n} dias: ${a.titulo}`)}`, 'TRIGGER:-PT0M', 'END:VALARM',
      'END:VEVENT'
    );
  }
  return linhas;
}
function gerarICS(lista) {
  const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//EntregAi//Organizador de entregas//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ALE'];
  lista.forEach(a => linhas.push(...eventosICS(a)));
  linhas.push('END:VCALENDAR');
  return linhas.map(dobrar).join('\r\n') + '\r\n';
}
function baixar(nome, conteudo, tipo) {
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = nome; link.rel = 'noopener';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function baixarICS(ids) {
  const lista = ids.map(id => db.atividades.find(a => a.id === id)).filter(Boolean);
  if (!lista.length) { toast('Não há entregas pendentes para exportar.', 'erro'); return; }
  const nome = lista.length === 1 ? `entregai-${semAcento(lista[0].titulo).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40)}.ics` : 'entregai-pendentes.ics';
  baixar(nome, gerarICS(lista), 'text/calendar;charset=utf-8');
  toast(lista.length === 1 ? 'Arquivo de calendário baixado. Abra o arquivo para salvar o evento com os lembretes.' : `${lista.length} entregas exportadas. Abra o arquivo para adicionar todas ao seu calendário.`);
}
function linkGoogle(a) {
  const ini = entregaEm(a), fim = new Date(ini.getTime() + 36e5);
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: `${a.tipo} – ${turma(a.turma).nome}: ${a.titulo}`,
    dates: `${icsData(ini)}/${icsData(fim)}`,
    details: descricaoCal(a),
    ctz: 'America/Sao_Paulo',
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

function toast(msg, tipo = 'ok') {

function abrirDialogo(html, classe = '') {
  const d = $('#dlg');

  if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  return d;
}
function fecharDialogo() { const d = $('#dlg'); if (d.open) d.close ? d.close() : d.removeAttribute('open'); }
function confirmar({ titulo, texto, botao = 'Confirmar', perigo = false }) {
  return new Promise(res => {
    const d = abrirDialogo(`<form method="dialog" class="dlg"><h2 id="dlg-titulo">${esc(titulo)}</h2><p>${esc(texto)}</p>
      <div class="botoes"><button class="btn sec" value="nao">Cancelar</button><button class="btn ${perigo ? 'perigo' : 'prim'}" value="sim">${esc(botao)}</button></div></form>`);
    d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'sim'), { once: true });
  });
}

async function baixarAnexo(id) {
  const a = db.atividades.find(x => x.id === id);
  if (!a || !a.anexo) return;
  try {
    const blob = await Arquivos.ler(a.anexo.id);
    if (!blob) throw new Error('não encontrado');
    baixar(a.anexo.nome, blob);
  } catch (e) {
    toast('O arquivo não está salvo neste navegador. Peça ao professor para anexá-lo de novo.', 'erro');
  }
}
function alternarConcluida(id) {

  if (!u || !a || u.papel !== 'aluno') return;
  db.concluidas[u.id] = db.concluidas[u.id] || {};

function mostrarErros(form, erros) {
  $$('[data-erro]', form).forEach(el => { el.textContent = erros[el.dataset.erro] || ''; });
  $$('[name]', form).forEach(el => {
    if (el.type === 'radio' || el.type === 'checkbox') return;
    if (erros[el.name]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
  });
  const primeiro = Object.keys(erros).find(k => k !== 'geral');
  if (primeiro) {
    const campo = form.querySelector(`[name="${primeiro}"]`);
    if (campo) campo.focus();
  }
}
async function enviarEntrar(form) {
  const f = new FormData(form);
  const papel = f.get('papel');
  const id = String(f.get('id') || '').trim().toLowerCase();
  const senha = String(f.get('senha') || '');
  const erros = {};
  if (!id) erros.id = 'Digite seu e-mail ou RGM.';
  if (!senha) erros.senha = 'Digite sua senha.';
  if (Object.keys(erros).length) return mostrarErros(form, erros);
  const u = db.usuarios.find(x => x.email === id || x.rgm === id);
  if (!u || u.senha !== await hash(senha)) return mostrarErros(form, { geral: 'E-mail, RGM ou senha incorretos. Confira os dados ou faça seu cadastro.' });
  if (u.papel !== papel) return mostrarErros(form, { geral: `Este cadastro é de ${u.papel}. Escolha “Sou ${u.papel}” acima e tente de novo.` });
  entrarComo(u.id);
}
function entrarComo(id) {

  if (!u) { toast('Conta de teste não encontrada. Use “Restaurar dados de demonstração” no rodapé.', 'erro'); return; }
  ls.set(SKEY, u.id);
  editandoId = null;

async function enviarCadastro(form) {
  const papel = form.dataset.papel;
  const f = new FormData(form);
  const nome = String(f.get('nome') || '').trim().replace(/\s+/g, ' ');
  const email = String(f.get('email') || '').trim().toLowerCase();
  const rgm = String(f.get('rgm') || '').trim();
  const turmas = f.getAll('turmas');
  const senha = String(f.get('senha') || ''), senha2 = String(f.get('senha2') || '');
  const erros = {};
  if (nome.length < 3) erros.nome = 'Digite seu nome completo.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) erros.email = 'Digite um e-mail válido, como nome@exemplo.com.';
  else if (db.usuarios.some(u => u.email === email)) erros.email = 'Já existe um cadastro com este e-mail. Volte e entre com sua conta.';
  if (!/^\d{5,12}$/.test(rgm)) erros.rgm = 'O RGM deve ter só números, de 5 a 12 dígitos.';
  else if (db.usuarios.some(u => u.rgm === rgm)) erros.rgm = 'Já existe um cadastro com este RGM. Volte e entre com sua conta.';
  if (!turmas.length) erros.turmas = papel === 'aluno' ? 'Escolha pelo menos uma turma.' : 'Escolha pelo menos uma matéria.';
  if (senha.length < 6) erros.senha = 'A senha precisa ter pelo menos 6 caracteres.';
  else if (senha !== senha2) erros.senha2 = 'As senhas não são iguais. Digite a mesma senha nos dois campos.';
  if (Object.keys(erros).length) {
    mostrarErros(form, erros);
    if (erros.turmas && Object.keys(erros).length === 1) form.querySelector('[name="turmas"]').focus();
    return;
  }
  const u = { id: uid(), papel, nome, email, rgm, turmas, senha: await hash(senha), criado: new Date().toISOString() };
  db.usuarios.push(u);
  db.concluidas[u.id] = {}; db.enviados[u.id] = {}; db.avisos[u.id] = [];
  if (!salvar()) return;
  ls.set(SKEY, u.id);
  location.hash = papel === 'aluno' ? '#/aluno' : '#/professor';
  toast(`Cadastro de ${papel} criado. Bem-vindo(a), ${primeiroNome(nome)}!`);
}
async function enviarLancamento(form) {
  const u = usuarioAtual();
  const f = new FormData(form);
  const atual = editandoId ? db.atividades.find(x => x.id === editandoId) : null;
  const dados = {
    tipo: f.get('tipo') || 'Atividade',
    titulo: String(f.get('titulo') || '').trim(),
    turma: f.get('turma'),
    professor: String(f.get('professor') || '').trim(),
    data: f.get('data'),
    hora: f.get('hora') || '23:59',
    aula: f.get('aula') || '',
    descricao: String(f.get('descricao') || '').trim(),
    prioridade: f.get('prioridade') || 'media',
    ehGrupo: f.get('ehGrupo') === 'on',
    integrantes: String(f.get('integrantes') || '').split(',').map(x=>x.trim()).filter(Boolean),
  };
  const valorTxt = String(f.get('valor') || '').replace(',', '.');
  const valor = Number(valorTxt);
  const arq = form.anexo.files[0];
  const erros = {};
  if (!dados.titulo) erros.titulo = 'Digite o nome do trabalho, atividade ou prova.';
  if (!dados.turma) erros.turma = 'Escolha a matéria.';
  if (!dados.professor) erros.professor = 'Digite o nome do professor(a).';
  if (!dados.data) erros.data = 'Escolha a data de entrega.';
  else if (!atual && diasAte(dados.data) < 0) erros.data = 'Essa data já passou. Escolha hoje ou uma data futura.';

  if (valorTxt === '' || isNaN(valor) || valor < 0 || valor > 100) erros.valor = 'Informe quantos pontos vale, de 0 a 100.';
  if (arq && arq.size > 10 * 1048576) erros.anexo = `O arquivo tem ${fmtTam(arq.size)}. Envie um arquivo de até 10 MB.`;
  if (Object.keys(erros).length) return mostrarErros(form, erros);

  const botao = $('#btn-lancar'); botao.disabled = true;
  let anexo = atual ? atual.anexo || null : null;
  try {
    if (anexo && (form.removerAnexo && form.removerAnexo.checked || arq)) { await Arquivos.apagar(anexo.id); anexo = null; }
    if (arq) {
      const id = uid();
      await Arquivos.salvar(id, arq);
      anexo = { id, nome: arq.name, tamanho: arq.size, tipo: arq.type };
    }
  } catch (e) {
    botao.disabled = false;
    return mostrarErros(form, { anexo: 'Não foi possível salvar o arquivo neste navegador. Tente um arquivo menor ou saia do modo anônimo.' });
  }
  if (atual) {
    Object.assign(atual, dados, { valor, anexo, editado: new Date().toISOString() });
    if (!anexo) delete atual.anexo;
  } else {
    const nova = { id: uid(), ...dados, valor, criadoPor: u.id, criado: new Date().toISOString() };
    if (anexo) nova.anexo = anexo;
    db.atividades.push(nova);
  }
  if (!salvar()) { botao.disabled = false; return; }
  const mat = turma(dados.turma).nome;
  editandoId = null;
  render({ manterFoco: true });
  toast(atual ? `Alterações salvas em “${dados.titulo}”.` : `${dados.tipo} lançada para ${mat}. Os alunos já podem ver.`.replace('Trabalho lançada', 'Trabalho lançado'));
  const t = $('#t-lanc'); if (t) { t.setAttribute('tabindex', '-1'); t.focus(); }
}
async function excluir(id) {
  const a = db.atividades.find(x => x.id === id);
  if (!a) return;
  const ok = await confirmar({ titulo: `Excluir “${a.titulo}”?`, texto: 'Os alunos deixarão de ver este lançamento e o arquivo anexado será apagado. Não é possível desfazer.', botao: 'Excluir lançamento', perigo: true });
  if (!ok) return;
  if (a.anexo) await Arquivos.apagar(a.anexo.id);
  db.atividades = db.atividades.filter(x => x.id !== id);
  Object.values(db.concluidas).forEach(c => { delete c[id]; });
  if (editandoId === id) editandoId = null;
  salvar();
  render({ manterFoco: true });
  toast(`“${a.titulo}” foi excluída.`);
}
async function restaurar() {
  const ok = await confirmar({ titulo: 'Restaurar dados de demonstração?', texto: 'Cadastros, lançamentos, arquivos e marcações feitos neste navegador serão apagados e as contas de teste voltarão ao estado inicial.', botao: 'Restaurar dados', perigo: true });
  if (!ok) return;
  await Arquivos.limpar();
  db = await criarDemo();
  salvar();
  ls.del(SKEY); ls.del(AKEY);
  editandoId = null;
  location.hash = '#/entrar';
  render();
  toast('Dados de demonstração restaurados.');
}

let rotaAnterior = null;
function render(op = {}) {
  const u = usuarioAtual();
  let r = (location.hash || '#/').slice(1).split('?')[0];
  const publicas = ['/entrar', '/cadastro/aluno', '/cadastro/professor'];
  if (!u && !publicas.includes(r)) r = '/entrar';
  const rotasAluno = ['/aluno','/calendario','/radar','/sos','/simulador','/planejamento','/historico'];
  if (u && (r === '/' || publicas.includes(r) || !(u.papel === 'aluno' ? rotasAluno : ['/professor']).includes(r))) r = u.papel === 'aluno' ? '/aluno' : '/professor';
  if (u && u.papel !== 'aluno' && r !== '/professor') r = '/professor';
  if (location.hash.slice(1).split('?')[0] !== r) history.replaceState(null, '', '#' + r);

  const telas = { '/entrar': vEntrar, '/cadastro/aluno': () => vCadastro('aluno'), '/cadastro/professor': () => vCadastro('professor'), '/aluno': vAluno, '/professor': vProfessor, '/calendario': vCalendario, '/radar': vRadar, '/sos': vSOS, '/simulador': vSimulador, '/planejamento': vPlanejamento, '/historico': vHistorico };
  const scroll = window.scrollY;
  $('#app').innerHTML = (u ? barra(u) : barraPublica()) + telas[r]() + rodape();
  const titulos = { '/entrar': 'Entrar', '/cadastro/aluno': 'Cadastro de aluno', '/cadastro/professor': 'Cadastro de professor', '/aluno': 'Painel do aluno', '/professor': 'Painel do professor', '/calendario':'Calendário acadêmico', '/radar':'Radar acadêmico', '/sos':'Modo SOS acadêmico', '/simulador':'Simulador de atraso', '/planejamento':'Planejamento de estudos', '/historico':'Histórico acadêmico' };
  document.title = `${titulos[r]} | ALE`;

  if (r === '/aluno') {
    renderListaAluno();
    $('#f-busca').addEventListener('input', e => { filtros.busca = e.target.value; renderListaAluno(); });
    $('#f-turma').addEventListener('change', e => { filtros.turma = e.target.value; renderListaAluno(); });
    atualizarSino();
  }
  if (r === '/calendario') atualizarSino();
  if (r === '/radar' || r === '/sos' || r === '/simulador' || r === '/planejamento' || r === '/historico') atualizarSino();
  if (r === '/professor') {
    renderListaProf();
    $('#f-prof').addEventListener('change', e => { filtroProf = e.target.value; renderListaProf(); });
    $$('#form-lanc [name="tipo"]').forEach(el => el.addEventListener('change', () => {
      if (!editandoId) $('#btn-lancar').textContent = 'Lançar ' + el.value.toLowerCase();
    }));
  }
  const fe = $('#form-entrar'); if (fe) fe.addEventListener('submit', e => { e.preventDefault(); enviarEntrar(fe); });
  const fc = $('#form-cadastro'); if (fc) fc.addEventListener('submit', e => { e.preventDefault(); enviarCadastro(fc); });
  const fl = $('#form-lanc'); if (fl) fl.addEventListener('submit', e => { e.preventDefault(); enviarLancamento(fl); });

  renderAba();
  if (op.manterFoco) window.scrollTo(0, scroll);
  else if (rotaAnterior !== r) { window.scrollTo(0, 0); const h = $('h1'); if (h && rotaAnterior !== null) h.focus({ preventScroll: true }); }
  rotaAnterior = r;
  if (r === '/aluno') setTimeout(verificarAvisos, 600);
}

function vCalendario(){
 const items=alunoDados(), params=new URLSearchParams(location.hash.split('?')[1]||'');
 const monthParam=params.get('mes'), view=params.get('view')||'month';
 const base=monthParam?new Date(monthParam+'-01T12:00:00'):new Date();
 const y=base.getFullYear(),m=base.getMonth();
 const monthName=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(base);
 const prev=new Date(y,m-1,1),next=new Date(y,m+1,1);
 const dayItems=d=>items.filter(a=>a.data===isoDate(d));
 const eventList=d=>dayItems(d).map(a=>`<button data-action="abrir" data-id="${a.id}" class="ale-event ${foiConcluida(a,usuarioAtual())?'done':''}">${esc(a.titulo)} · ${esc(turma(a.turma).nome)}</button>`).join('')||'<small>Sem atividades</small>';
 const first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 const cells=Array(offset).fill(null).concat(Array.from({length:days},(_,i)=>i+1));
 let body='';
 if(view==='month'){
  body=`<div class="ale-week">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<b>${x}</b>`).join('')}</div><div class="ale-days">${cells.map(d=>d?`<div class="ale-day ${isoDate(new Date(y,m,d))===hojeISO()?'is-today':''}"><strong>${d}</strong>${dayItems(new Date(y,m,d)).slice(0,3).map(a=>`<button data-action="abrir" data-id="${a.id}" title="${esc(a.titulo)}" class="ale-event ${foiConcluida(a,usuarioAtual())?'done':''}">${esc(a.titulo)}</button>`).join('')}${dayItems(new Date(y,m,d)).length>3?`<small>+${dayItems(new Date(y,m,d)).length-3} atividades</small>`:''}</div>`:'<div class="ale-day empty"></div>').join('')}</div>`;
 }else{

  if(view==='week'){const offsetNow=(start.getDay()+6)%7;start.setDate(start.getDate()-offsetNow);}
  const count=view==='day'?1:7;
  body=`<div class="ale-agenda">${Array.from({length:count},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return `<section class="ale-agendaday ${isoDate(d)===hojeISO()?'is-today':''}"><div><b>${new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(d)}</b><small>${pad(d.getDate())}/${pad(d.getMonth()+1)}</small></div><div>${eventList(d)}</div></section>`}).join('')}</div>`;
 }
 return pageShell('Calendário acadêmico','Visualize sua rotina por dia, semana ou mês. As atividades publicadas pelo professor entram automaticamente.',`
 <section class="cartao ale-calendar">
 <div class="ale-viewtabs">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([v,l])=>`<button class="btn ${view===v?'prim':'sec'}" data-action="calendar-view" data-view="${v}">${l}</button>`).join('')}</div>
 <div class="ale-month"><button class="btn sec" data-action="mes" data-mes="${isoDate(prev).slice(0,7)}">← Mês anterior</button><h2>${monthName}</h2><button class="btn sec" data-action="mes" data-mes="${isoDate(next).slice(0,7)}">Próximo mês →</button></div>
 ${body}
 <p class="ale-note">Os prazos oficiais não são alterados pelo calendário. Clique em uma atividade para ver os detalhes.</p></section>
 <section class="cartao"><h2>Próximas entregas</h2>${pendentesAluno().filter(a=>diasAte(a.data)>=0).slice(0,6).map(a=>`<p class="ale-line"><span><b>${esc(a.titulo)}</b><small>${esc(turma(a.turma).nome)}</small></span><b>${fmtData(a.data)}</b></p>`).join('')||'<p class="vazio">Nenhuma entrega futura cadastrada.</p>'}</section>`);
}
function vRadar(){
 const pend=pendentesAluno().filter(a=>diasAte(a.data)>=0), weeks=[];
 for(let w=0;w<4;w++){const start=w*7,end=start+6,arr=pend.filter(a=>diasAte(a.data)>=start&&diasAte(a.data)<=end);weeks.push({w,start,end,arr,hrs:arr.reduce((s,a)=>s+Number(a.horasEstimadas||2),0)});}
 const total=weeks.reduce((s,w)=>s+w.hrs,0), max=Math.max(1,...weeks.map(w=>w.hrs));
 const hot=weeks.filter(w=>w.arr.length>=3||w.hrs>=10);
 return pageShell('Radar Acadêmico','Encontre semanas críticas antes que os prazos se acumulem.',`
 <section class="ale-kpis"><article><span>Entregas futuras</span><strong>${pend.length}</strong></article><article><span>Horas estimadas</span><strong>${total}h</strong></article><article><span>Semanas em alerta</span><strong>${hot.length}</strong></article></section>
 <section class="cartao"><div class="ale-sectiontitle"><h2>Mapa das próximas 4 semanas</h2><span>Estimativa inicial: 2h por atividade, ajustável no planejamento</span></div>
 ${weeks.map(w=>`<div class="ale-radarrow"><div><b>${w.w===0?'Esta semana':`Semana ${w.w+1}`}</b><small>${w.arr.length} atividade(s) · ${w.hrs}h estimadas</small></div><div class="ale-meter"><i style="width:${Math.min(100,w.hrs/max*100)}%"></i></div><strong>${w.hrs}h</strong><span class="ale-risk ${w.arr.length>=3||w.hrs>=10?'risk-high':w.arr.length>=2||w.hrs>=6?'risk-mid':'risk-low'}">${w.arr.length>=3||w.hrs>=10?'Sobrecarga':w.arr.length>=2||w.hrs>=6?'Atenção':'Controlada'}</span></div>`).join('')}
 </section><section class="cartao"><h2>Previsão de Caos</h2><p>${hot.length?`Foram identificadas ${hot.length} semana(s) com concentração de entregas. Antecipe as tarefas maiores e use o Modo SOS para distribuir o esforço.`:'Sua carga atual está distribuída. Continue revisando o radar sempre que novas atividades forem publicadas.'}</p>
 ${hot.map(w=>`<p class="ale-alert">⚠ ${w.w===0?'Esta semana':`Semana ${w.w+1}`} concentra ${w.arr.length} entregas (${w.hrs}h estimadas).</p>`).join('')}</section>`);
}
function vSOS(){
 const pend=pendentesAluno().filter(a=>diasAte(a.data)>=0);
 const avail=Number(db.configAluno?.horasDia||2);
 const peso={alta:0,media:1,baixa:2}; const sorted=[...pend].sort((a,b)=>diasAte(a.data)-diasAte(b.data)||(peso[a.prioridade||'media']-peso[b.prioridade||'media']));
 let acumulado=0,plan=[];
 for(const a of sorted){const h=Number(a.horasEstimadas||2);const inicio=Math.floor(acumulado/avail);const fim=Math.floor(Math.max(0,acumulado+h-0.001)/avail);plan.push({a,take:h,inicio,fim});acumulado+=h;}
 return pageShell('Modo SOS Acadêmico','Quando a semana apertar, reorganize o que fazer primeiro sem mexer nos prazos oficiais.',`
 <section class="cartao ale-sos"><div class="ale-sos-icon">✦</div><div><h2>Vamos recuperar o controle.</h2><p>Informe quanto tempo você tem por dia. O ALE prioriza as entregas mais próximas e estima em quais dias encaixar cada bloco de estudo.</p></div>
 <label class="campo">Horas disponíveis por dia<input id="sos-horas" type="number" min="1" max="16" value="${avail}"></label><button class="btn prim" data-action="recalcular-sos">Reorganizar meu plano</button></section>
 <section class="cartao"><h2>Plano sugerido por urgência</h2>${plan.map((p,i)=>`<div class="ale-planrow"><span class="ale-number">${i+1}</span><div><b>${esc(p.a.titulo)}</b><small>${fmtData(p.a.data)} · ${esc(turma(p.a.turma).nome)}</small><small>${p.take}h estimadas · iniciar ${p.inicio===0?'hoje':`em ${p.inicio} dia(s)`}${p.fim>p.inicio?` · distribuir até ${p.fim} dia(s) depois`:''}</small></div><span class="ale-risk ${diasAte(p.a.data)<=2?'risk-high':'risk-mid'}">${diasAte(p.a.data)<=2?'Urgente':'Priorizar'}</span></div>`).join('')||'<p class="vazio">Sem atividades futuras para reorganizar.</p>'}
 <p class="ale-note">O plano é uma recomendação local. Ele não muda datas, entregas ou publicações do professor.</p></section>`);
}
function vSimulador(){
 const pend=pendentesAluno().filter(a=>diasAte(a.data)>=0); const q=new URLSearchParams(location.hash.split('?')[1]||''); const delay=Math.max(0,Math.min(30,Number(q.get('dias')||3)));
 return pageShell('Simulador: e se eu atrasar?','Teste cenários de atraso para entender o impacto na sua semana, sem alterar os prazos reais.',`
 <section class="cartao"><label class="campo">Simular atraso de <b>${delay} dia(s)</b><input id="sim-dias" type="range" min="0" max="30" value="${delay}"></label><p class="ale-note">Cenário hipotético: as datas oficiais continuam exatamente como foram publicadas.</p><div class="ale-kpis"><article><span>Atividades impactadas</span><strong>${pend.filter(a=>diasAte(a.data)<=delay).length}</strong></article><article><span>Continuam no prazo</span><strong>${pend.filter(a=>diasAte(a.data)>delay).length}</strong></article><article><span>Atraso máximo</span><strong>${delay} dias</strong></article></div>
 <h2>Impacto por atividade</h2>${pend.map(a=>{const d=diasAte(a.data)-delay;return `<div class="ale-line"><span><b>${esc(a.titulo)}</b><small>${esc(turma(a.turma).nome)} · prazo original ${fmtData(a.data)}</small></span><span class="ale-risk ${d<0?'risk-high':d<=3?'risk-mid':'risk-low'}">${d<0?`${-d} dia(s) atrasada`:d===0?'Entrega no dia':`${d} dia(s) restantes`}</span></div>`}).join('')||'<p class="vazio">Não há entregas futuras.</p>'}
 <button class="btn sec" data-action="reset-simulador">Limpar simulação</button></section>`);
}
function vPlanejamento(){
 const pend=pendentesAluno().filter(a=>diasAte(a.data)>=0); const u=usuarioAtual();
 const plan=db.planejamento?.[u.id]||{};
 return pageShell('Planejamento de estudos','Estime o esforço, quebre trabalhos em etapas e acompanhe seu progresso.',`
 <section class="cartao"><h2>Disponibilidade semanal</h2><form id="form-planejamento" class="ale-form"><label class="campo">Horas de estudo por dia<input name="horas" type="number" min="1" max="16" value="${plan.horas||2}"></label><button class="btn prim">Salvar disponibilidade</button></form></section>
 <section class="cartao"><h2>Estimativa e etapas</h2><p class="ale-note">Defina a estimativa de horas e divida trabalhos maiores em pequenas etapas.</p>
 ${pend.map(a=>{const h=Number(a.horasEstimadas||2),steps=a.etapas||[];return `<article class="ale-task"><div><b>${esc(a.titulo)}</b><small>${fmtData(a.data)} · ${esc(turma(a.turma).nome)}</small></div><label class="campo">Horas estimadas<input type="number" min="0.5" step="0.5" value="${h}" data-hours="${a.id}"></label><div class="ale-progress"><i style="width:${steps.length?Math.min(100,steps.filter(s=>s.done).length/steps.length*100):0}%"></i></div><small>${steps.filter(s=>s.done).length}/${steps.length} etapas concluídas</small><form data-step-form="${a.id}" class="ale-form"><input name="etapa" placeholder="Nova etapa (ex.: pesquisar referências)" required><button class="btn sec">Adicionar etapa</button></form>${steps.map((s,i)=>`<label class="ale-check"><input type="checkbox" data-step-toggle="${a.id}" data-step-index="${i}" ${s.done?'checked':''}>${esc(s.nome)}</label>`).join('')}</article>`}).join('')||'<p class="vazio">As atividades publicadas aparecerão aqui.</p>'}</section>`);
}
function vHistorico(){
 const u=usuarioAtual(), all=alunoDados(), done=all.filter(a=>foiConcluida(a,u)), total=all.length, rate=total?Math.round(done.length/total*100):0;
 return pageShell('Progresso e histórico','Consulte o que já foi concluído e acompanhe sua evolução acadêmica.',`
 <section class="ale-kpis"><article><span>Concluídas</span><strong>${done.length}</strong></article><article><span>Atividades totais</span><strong>${total}</strong></article><article><span>Taxa de conclusão</span><strong>${rate}%</strong></article></section>
 <section class="cartao"><h2>Seu progresso</h2><div class="ale-progress big"><i style="width:${rate}%"></i></div><p>${rate}% das atividades cadastradas estão marcadas como concluídas.</p></section>
 <section class="cartao"><h2>Histórico de entregas</h2>${done.length?ordenar(done).reverse().map(a=>`<div class="ale-line"><span><b>${esc(a.titulo)}</b><small>${esc(turma(a.turma).nome)} · ${a.tipo}</small></span><span class="ale-risk risk-low">Concluída</span></div>`).join(''):'<p class="vazio">Suas atividades concluídas ficarão registradas aqui.</p>'}</section>`);
}
function tratarAcoesALE(el){
 const u=usuarioAtual();
 switch(el.dataset.action){
 case 'mes': location.hash='#/calendario?view=month&mes='+el.dataset.mes; return true;
 case 'calendar-view': location.hash='#/calendario?view='+el.dataset.view; return true;
 case 'recalcular-sos': db.configAluno=db.configAluno||{};db.configAluno.horasDia=Math.max(1,Math.min(16,Number($('#sos-horas')?.value||2)));salvar();render();toast('Plano reorganizado com sua disponibilidade.');return true;
 case 'reset-simulador':location.hash='#/simulador';return true;
 }
 return false;
}
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.id==='form-lembretes'){e.preventDefault();const u=usuarioAtual();db.lembretes=db.lembretes||{};db.lembretes[u.id]={dias:[...(f.d15.checked?[15]:[]),...(f.d5.checked?[5]:[])],dia:f.dia.checked};db.enviados[u.id]=db.enviados[u.id]||{};salvar();toast('Preferências de lembretes salvas.');return;}
 if(f.id==='form-planejamento'){e.preventDefault();const u=usuarioAtual();db.planejamento=db.planejamento||{};db.planejamento[u.id]={...(db.planejamento[u.id]||{}),horas:Math.max(1,Math.min(16,Number(f.horas.value||2)))};db.configAluno=db.configAluno||{};db.configAluno.horasDia=db.planejamento[u.id].horas;salvar();toast('Disponibilidade salva.');render();return;}
 const aid=f.dataset.stepForm;if(aid){e.preventDefault();const a=db.atividades.find(x=>x.id===aid);if(!a)return;a.etapas=a.etapas||[];a.etapas.push({nome:String(f.etapa.value).trim(),done:false});salvar();render();toast('Etapa adicionada ao trabalho.');}
});
document.addEventListener('change',e=>{
 const h=e.target.dataset.hours;if(h){const a=db.atividades.find(x=>x.id===h);if(a){a.horasEstimadas=Math.max(.5,Number(e.target.value||2));salvar();}}
 const id=e.target.dataset.stepToggle;if(id){const a=db.atividades.find(x=>x.id===id);if(a&&a.etapas){a.etapas[Number(e.target.dataset.stepIndex)].done=e.target.checked;salvar();render();}}
 if(e.target.id==='sim-dias'){location.hash='#/simulador?dias='+e.target.value;}
});

document.addEventListener('click', e => {
  $$('details.cal[open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); });
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  if (typeof tratarAcoesALE === 'function' && tratarAcoesALE(el)) return;
  switch (el.dataset.action) {
    case 'tema': alternarTema(); break;
    case 'sair': ls.del(SKEY); fecharDialogo(); location.hash = '#/entrar'; toast('Você saiu da sua conta.'); break;
    case 'demo': entrarComo(id); break;
    case 'situacao': filtros.situacao = el.dataset.valor; $$('[data-action="situacao"]').forEach(b => b.setAttribute('aria-pressed', b === el)); renderListaAluno(); break;
    case 'concluir': alternarConcluida(id); break;
    case 'abrir': abrirDetalhes(id); break;
    case 'fechar': fecharDialogo(); break;
    case 'ics': baixarICS([id]); el.closest('details')?.removeAttribute('open'); break;
    case 'ics-todas': { const u = usuarioAtual(); baixarICS(ordenar(atividadesDoAluno(u).filter(a => !foiConcluida(a, u) && diasAte(a.data) >= 0)).map(a => a.id)); break; }
    case 'anexo': baixarAnexo(id); break;
    case 'editar': fecharDialogo(); editandoId = id; render({ manterFoco: true }); { const f = $('#form-lanc'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'start' }); f.querySelector('[name="titulo"]').focus({ preventScroll: true }); } } break;
    case 'cancelar-edicao': editandoId = null; render({ manterFoco: true }); break;
    case 'excluir': excluir(id); break;
    case 'avisos': abrirAvisos(); break;
    case 'permissao': pedirPermissao(); break;
    case 'teste-aviso': avisoTeste(); break;
    case 'aba': { const aba = $('#aba'); const nova = aba.dataset.aberta === 'true' ? 'false' : 'true'; ls.set(AKEY, nova); renderAba(); $('#aba .aba-topo').focus(); break; }
    case 'restaurar': restaurar(); break;
  }
});
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) fecharDialogo(); });
window.addEventListener('hashchange', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && db) { renderAba(); verificarAvisos(); } });
setInterval(() => { if (db) { renderAba(); verificarAvisos(); } }, 30000);
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { db = JSON.parse(e.newValue); render({ manterFoco: true }); } catch (err) {} } });

(async function iniciar() {
  try { db = JSON.parse(ls.get(KEY)); } catch (e) { db = null; }
  if (!db || !db.usuarios) { db = await criarDemo(); salvar(); }
  db.atividades.forEach(a=>{if(!a.hora)a.hora='23:59';});
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
